name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write
  # NuGet Trusted Publishing (Zipadee.Build - see issue reported after v0.5.2: the package has
  # never actually been published anywhere reachable, so every real install's PackageReference
  # silently fails to restore) exchanges this OIDC token for a short-lived nuget.org API key -
  # no long-lived secret to store or leak.
  id-token: write

jobs:
  publish-artifacts:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (not just the tag's) needed for the "is this tag on main" ancestry
          # check below - a shallow checkout wouldn't have origin/main's history available.
          fetch-depth: 0

      - name: Verify release tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "This release's tag is not reachable from main (target: ${{ github.event.release.target_commitish }}) - refusing to build/publish. Pick an existing tag on main when drafting the release, don't create a new one against another branch."
            exit 1
          }
          Write-Output "Tag is on main - proceeding."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure local NuGet feed exists
        run: New-Item -ItemType Directory -Force LocalPackages

      - name: Restore
        run: dotnet restore Zipadee.slnx

      # Computed once and shared via $env:GITHUB_ENV rather than duplicating the tag-parsing/
      # validation in every step that needs it (the VSIX manifest stamp below, and the
      # Zipadee.Build NuGet version) - each `run:` step is its own process, so a plain
      # PowerShell variable wouldn't survive between steps.
      - name: Compute release version from tag
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            Write-Error "Release tag '$tag' isn't a plain dotted version (e.g. v1.2.0) - VSIX/NuGet version numbers can't have suffixes like '-beta'. Rename the tag/release and try again."
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Release version: $version"

      - name: Stamp VSIX version from release tag
        run: |
          $manifestPath = "src/Zipadee.Vsix/source.extension.vsixmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("v", "http://schemas.microsoft.com/developer/vsx-schema/2011")
          $identity = $manifest.SelectSingleNode("//v:Identity", $ns)
          $identity.SetAttribute("Version", "$env:VERSION")
          $manifest.Save((Resolve-Path $manifestPath))
          Write-Output "Stamped VSIX version: $env:VERSION"

      - name: Build (Release)
        run: dotnet build Zipadee.slnx --configuration Release --no-restore

      # Signs the built VSIX (issue #61) so installs are verifiable/tamper-evident - a self-issued
      # certificate isn't accepted by the Marketplace, and a paid CA cert isn't justified yet, so
      # this uses SignPath.io's free code-signing program for open-source projects. No-op (skipped,
      # not failed) until SIGNPATH_API_TOKEN exists as a repo secret - i.e. until the OSS
      # application is approved and the org/project/policy slugs below are known for real. Same
      # no-op-until-configured pattern as VS_PUBLISHER_ACCESS_TOKEN below.
      - name: Upload unsigned VSIX for signing
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: unsigned-vsix
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-vsix
          path: src/Zipadee.Vsix/bin/Release/net472/*.vsix
          retention-days: 1

      - name: Sign VSIX via SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          # TODO: fill in once the SignPath OSS application is approved and a project is created.
          organization-id: 'TODO'
          project-slug: 'zipadee'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'vsix'
          github-artifact-id: ${{ steps.unsigned-vsix.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'src/Zipadee.Vsix/bin/Release/net472/signed'

      - name: Replace unsigned VSIX with signed copy
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: Copy-Item src/Zipadee.Vsix/bin/Release/net472/signed/*.vsix src/Zipadee.Vsix/bin/Release/net472/ -Force

      - name: Upload VSIX to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" src/Zipadee.Vsix/bin/Release/net472/*.vsix --clobber

      # Publishes Zipadee.Build to NuGet.org (issue reported after v0.5.2: it had never actually
      # been published anywhere reachable - every real install's PackageReference to it silently
      # failed to restore, so the extension has never worked outside this dev machine's own
      # LocalPackages feed). Tied to the same release-tag version as the VSIX above, so the two
      # can never drift apart the way the project template's hardcoded version already did once.
      #
      # Uses NuGet Trusted Publishing (OIDC) rather than a stored API key - see
      # https://learn.microsoft.com/en-gb/nuget/nuget-org/trusted-publishing. Requires a Trusted
      # Publishing policy already configured on nuget.org for Jonesie/zipadee, workflow
      # release.yml, package pattern Zipadee.Build* - done as part of setting this up.
      - name: Pack Zipadee.Build
        run: dotnet pack build/Zipadee.Build/Zipadee.Build.csproj --configuration Release -o nupkg -p:Version=$env:VERSION --no-restore

      - name: NuGet login (OIDC to short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Jonesie

      - name: Push Zipadee.Build to NuGet.org
        # A literal resolved path, not a glob - confirmed empirically that unlike `gh release
        # upload` above (which expands a glob argument internally, a documented gh CLI feature),
        # `dotnet nuget push` does not, and PowerShell itself doesn't expand wildcards in
        # arguments passed to an external executable the way a POSIX shell would ("error: File
        # does not exist (nupkg/*.nupkg)"). Get-ChildItem is a real PowerShell cmdlet, so its own
        # wildcard expansion works normally here.
        run: |
          $nupkg = Get-ChildItem nupkg/*.nupkg | Select-Object -First 1 -ExpandProperty FullName
          dotnet nuget push "$nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Publishes to the Visual Studio Marketplace (issue #16) - skipped entirely (not failed)
      # until the VS_PUBLISHER_ACCESS_TOKEN secret actually exists, so this step is a no-op for
      # every release before the Marketplace publisher account/PAT are set up, rather than
      # breaking releases in the meantime. madskristensen/publish-marketplace downloads
      # Microsoft.VSSDK.BuildTools from NuGet itself to get a current VsixPublisher.exe - no VS
      # SDK install needed on the runner (confirmed via its own README, not assumed).
      - name: Publish to VS Marketplace
        # `secrets` isn't a recognized context inside a step's `if:` (confirmed via a real
        # workflow-file validation error: "Unrecognized named-value: 'secrets'") - route it
        # through env: instead, which if: can reference.
        if: ${{ env.VS_PUBLISHER_ACCESS_TOKEN != '' }}
        env:
          VS_PUBLISHER_ACCESS_TOKEN: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
        uses: madskristensen/publish-marketplace@v2
        with:
          # A literal path, not a glob - unlike the `gh release upload` step above (whose *.vsix
          # gets shell-expanded by pwsh before gh ever sees it), this action's `with:` inputs are
          # passed to it as literal strings with no shell expansion, so a glob pattern just fails
          # to match anything (confirmed empirically: "extension-file not found: ...*.vsix").
          # Zipadee.Vsix.vsix comes from the project's AssemblyName, not the PackageManifest's
          # Identity Id, so it doesn't change when that Identity's GUID does.
          extension-file: src/Zipadee.Vsix/bin/Release/net472/Zipadee.Vsix.vsix
          publish-manifest-file: marketplace/publishManifest.json
          personal-access-code: ${{ env.VS_PUBLISHER_ACCESS_TOKEN }}

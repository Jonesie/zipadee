name: Build main

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure local NuGet feed exists
        run: New-Item -ItemType Directory -Force LocalPackages

      - name: Restore
        run: dotnet restore Zipadee.slnx

      - name: Build (Release)
        run: dotnet build Zipadee.slnx --configuration Release --no-restore

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipadee-vsix
          path: src/Zipadee.Vsix/bin/Release/net472/*.vsix
          if-no-files-found: error

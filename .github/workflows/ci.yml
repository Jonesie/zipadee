name: CI

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure local NuGet feed exists
        run: New-Item -ItemType Directory -Force LocalPackages

      - name: Restore
        run: dotnet restore Zipadee.slnx

      - name: Build
        run: dotnet build Zipadee.slnx --configuration Release --no-restore

      # Zipadee.Build.Tests builds real fixture .zparchproj files as part of testing, which in
      # turn shell out to these same external tools any real consumer would need (see issue #20)
      # - neither installer adds itself to PATH automatically, same as a real dev machine.
      - name: Install 7-Zip and WinRAR
        run: |
          choco install 7zip --no-progress -y
          choco install winrar --no-progress -y
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\WinRAR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test
        run: dotnet test Zipadee.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --settings test/Zipadee.Build.Tests/coverlet.runsettings --results-directory TestResults

      # Coverage here only ever covers Zipadee.Build.Tests' own C# test-harness code (fixture
      # copying, process invocation, archive inspection) - almost all of Zipadee's actual
      # archiving logic lives in MSBuild XML (Zipadee.Build.targets), which standard coverage
      # tooling can't instrument at all. See issue #21: the real measure of "exhaustiveness" here
      # is that every documented format/option/validation scenario has a passing test, not this
      # percentage - this step exists so the C# that does exist is still visible, not as a
      # substitute for that.
      - name: Publish coverage summary
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:TestResults/**/coverage.cobertura.xml -targetdir:CoverageReport -reporttypes:MarkdownSummaryGithub
          Get-Content CoverageReport/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

name: CI

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Zipadee.slnx

      - name: Build
        run: dotnet build Zipadee.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Zipadee.slnx --configuration Release --no-build
